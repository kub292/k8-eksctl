apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: expense
  region: us-east-1
  version: "1.34"

managedNodeGroups:
  - name: expense-ng
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 3

    volumeSize: 20
    amiFamily: AmazonLinux2023

    ssh:
      allow: true

    labels:
      environment: dev
      project: expense

    tags:
      Name: expense-nodegroup

    privateNetworking: false